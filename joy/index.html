<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>JOY · 永久入口</title>
    <style>
      :root {
        --page: #f4f6f5;
        --panel: #ffffff;
        --ink: #17211f;
        --muted: #5a6b66;
        --line: #d7dfdc;
        --accent: #176b5b;
        --accent-hover: #105548;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 34px 32px 30px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        box-shadow: 0 18px 46px rgb(30 51 46 / 8%);
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #e9f2ef;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.6; }
      .routes { display: grid; gap: 10px; margin-top: 16px; }
      .route-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #f9fbfa;
        color: var(--ink);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
      .route-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">JOY 永久固定入口</span>
      <h1 id="title">正在进入 JOY…</h1>
      <p id="message">正在自动跳转到当前在线的 Cloudflare 免拦截直连隧道（无需加载 Ngrok 拦截页）。</p>
      <div class="routes">
        <a id="cfBtn" class="route-btn primary" href="https://passed-karma-nurse-mba.trycloudflare.com">
          <span>🌐 立即进入 JOY（Cloudflare 免拦截直连）</span>
          <span>直达 →</span>
        </a>
        <a id="localBtn" class="route-btn" href="http://localhost:3000">
          <span>💻 Mac 本机直连（http://localhost:3000）</span>
          <span>本机最快 →</span>
        </a>
      </div>
    </main>
    <script>
      async function start() {
        const cfBtn = document.getElementById("cfBtn");
        let targetUrl = cfBtn.href;
        try {
          const res = await fetch("./target.json?v=" + Date.now(), { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data && data.url && data.url.includes(".trycloudflare.com")) {
              targetUrl = data.url;
              cfBtn.href = targetUrl;
            }
          }
        } catch (_) {}
        window.location.replace(targetUrl);
      }
      start();
    </script>
  </body>
</html>
