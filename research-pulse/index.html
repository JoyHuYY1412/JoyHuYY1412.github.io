<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>JOY · 随时随地智能入口</title>
    <style>
      :root {
        --page: #f4f6f5;
        --panel: #ffffff;
        --ink: #17211f;
        --muted: #5a6b66;
        --line: #d7dfdc;
        --accent: #176b5b;
        --accent-hover: #105548;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(100%, 540px);
        padding: 34px 32px 30px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        box-shadow: 0 18px 46px rgb(30 51 46 / 8%);
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #e9f2ef;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.6; }
      .routes { display: grid; gap: 10px; margin-top: 16px; }
      .route-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #f9fbfa;
        color: var(--ink);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.15s ease;
      }
      .route-btn:hover {
        border-color: var(--accent);
        background: #eef6f4;
      }
      .route-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .route-btn.primary:hover {
        background: var(--accent-hover);
      }
      .tag {
        font-size: 12px;
        font-weight: 500;
        opacity: 0.88;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">JOY 永久固定入口 · 自动优选可用线路</span>
      <h1 id="title">正在为您自动检测最快可用线路…</h1>
      <p id="message">系统正在并行探测国内免翻墙直连线路、Ngrok 固定静态域名与本机服务，将自动跳转至当前网络下最快的在线入口。您也可以直接点击下方任一线路进入：</p>
      <div class="routes">
        <a id="cfBtn" class="route-btn primary" href="https://passed-karma-nurse-mba.trycloudflare.com">
          <span>🌐 线路 1：Cloudflare 国内免翻墙直连</span>
          <span class="tag" id="cfStatus">检测中…</span>
        </a>
        <a id="ngrokBtn" class="route-btn" href="https://poppy-playing-rocking.ngrok-free.dev">
          <span>🚀 线路 2：Ngrok 永久固定域名（海外/代理网络）</span>
          <span class="tag" id="ngrokStatus">检测中…</span>
        </a>
        <a id="localBtn" class="route-btn" href="http://localhost:3000">
          <span>💻 线路 3：Mac 本机直连（Localhost:3000）</span>
          <span class="tag" id="localStatus">本机最快</span>
        </a>
      </div>
    </main>
    <script>
      const cfBtn = document.getElementById("cfBtn");
      const ngrokBtn = document.getElementById("ngrokBtn");
      const cfStatus = document.getElementById("cfStatus");
      const ngrokStatus = document.getElementById("ngrokStatus");
      const title = document.getElementById("title");
      const ngrokUrl = "https://poppy-playing-rocking.ngrok-free.dev";

      async function probeRoute(url, timeoutMs = 3500) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          await fetch(url.replace(/\/$/, "") + "/api/health?t=" + Date.now(), {
            mode: "no-cors",
            cache: "no-store",
            signal: ctrl.signal,
          });
          clearTimeout(timer);
          return true;
        } catch (_) {
          clearTimeout(timer);
          return false;
        }
      }

      async function start() {
        let cfUrl = cfBtn.href;
        try {
          const res = await fetch("./target.json?v=" + Date.now(), { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data && data.url && data.url.startsWith("https://")) {
              cfUrl = data.url;
              cfBtn.href = cfUrl;
            }
          }
        } catch (_) {}

        let redirected = false;
        function go(url, label) {
          if (redirected) return;
          redirected = true;
          title.textContent = "已连通 " + label + "，正在进入 JOY…";
          setTimeout(() => window.location.replace(url), 180);
        }

        probeRoute(cfUrl, 3800).then((ok) => {
          cfStatus.textContent = ok ? "✅ 在线（直连）" : "建议使用线路 2";
          if (ok) go(cfUrl, "Cloudflare 直连线路");
        });

        probeRoute(ngrokUrl, 3800).then((ok) => {
          ngrokStatus.textContent = ok ? "✅ 在线（可用）" : "需开启代理";
          if (ok) go(ngrokUrl, "Ngrok 固定域名线路");
        });
      }

      start();
    </script>
  </body>
</html>
